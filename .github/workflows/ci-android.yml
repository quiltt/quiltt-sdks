name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "packages/android/**"
  pull_request:
    paths:
      - "packages/android/**"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/android

jobs:
  build:
    name: "Android CI (JDK ${{ matrix.jdk-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk-version: ["17", "21"] # 17 is the AGP 8.x minimum LTS; 21 is current LTS

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ matrix.jdk-version }}

      - uses: gradle/actions/setup-gradle@v4

      # No Gemfile.lock is committed: `bundler-cache` runs `bundle lock` when one
      # is missing, so it installs and caches the newest compatible gems.
      # The Ruby version is read from .ruby-version.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build connector
        run: ./gradlew connector:assembleRelease

      - name: Lint
        run: ./gradlew connector:lint

      - name: Unit tests
        run: ./gradlew connector:test

      - name: Build example app
        run: bundle exec fastlane android build_example_app
