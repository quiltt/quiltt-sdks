name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "packages/android/**"
  pull_request:
    paths:
      - "packages/android/**"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/android

jobs:
  build:
    name: "Android CI (JDK ${{ matrix.jdk-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk-version: ["17", "21"] # 17 is the AGP 8.x minimum LTS; 21 is current LTS

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ matrix.jdk-version }}

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric fetches its own `android-all-instrumented` jar from Maven Central on a cold
      # runner (the tests pin `@Config(sdk = [33])`), and a stalled fetch fails the job before any
      # test runs. `setup-gradle` only caches ~/.gradle, so cache Robolectric's own store.
      - name: Cache Robolectric Android jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('packages/android/connector/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      # No Gemfile.lock is committed: `bundler-cache` runs `bundle lock` when one
      # is missing, so it installs and caches the newest compatible gems.
      # The Ruby version is read from .ruby-version.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build connector
        run: ./gradlew connector:assembleRelease

      - name: Lint
        run: ./gradlew connector:lint

      - name: Unit tests
        run: ./gradlew connector:test

      - name: Build example app
        run: bundle exec fastlane android build_example_app
