name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - "packages/ios/**"
      - "Package.swift"
  pull_request:
    paths:
      - "packages/ios/**"
      - "Package.swift"
      - ".github/workflows/ci-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/ios

jobs:
  build:
    name: "iOS ${{ matrix.ios-version }} CI"
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios-version: "18.2"
            device: "iPhone 16 Pro"
          - ios-version: "17.5"
            device: "iPhone 15"

    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      # No Gemfile.lock is committed: `bundler-cache` runs `bundle lock` when one
      # is missing, so it installs and caches the newest compatible gems.
      # The Ruby version is read from .ruby-version.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict

      - name: Build Swift package
        working-directory: .
        run: swift build

      - name: Run tests
        working-directory: .
        run: |
          xcodebuild test \
            -scheme QuilttConnector \
            -destination "platform=iOS Simulator,OS=${{ matrix.ios-version }},name=${{ matrix.device }}" \
          || xcodebuild test \
            -scheme QuilttConnector \
            -destination "platform=iOS Simulator,name=${{ matrix.device }}"

      - name: Build example app
        if: matrix.ios-version == '18.2'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec fastlane ios build_example_app
