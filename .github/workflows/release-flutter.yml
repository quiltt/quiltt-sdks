name: Release Flutter SDK

# Triggered when release-mobile.yml pushes the flutter/v* tag. pub.dev's OIDC
# trusted-publishing check only accepts runs triggered by an actual tag `push`
# event (workflow_dispatch is rejected even when run against the tag ref).
on:
  push:
    tags:
      - "flutter/v*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  publish-flutter:
    name: Publish Flutter
    runs-on: ubuntu-latest
    # No `environment:` on purpose. pub.dev only requires one when its automated
    # publishing config sets "Require GitHub Actions environment" — that is
    # currently unchecked, so declaring one would couple this workflow to a
    # setting that does nothing for us (the pub-dev environment carries no
    # secrets and no protection rules). If the requirement is ever turned on,
    # add `environment: <name>` here, matching the name configured on pub.dev.
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: packages/flutter

    steps:
      # Fail before spending a checkout on a misconfigured credential. An empty
      # `token:` makes actions/checkout fall back to GITHUB_TOKEN, so this job
      # would run with the wrong identity and only fall over later, at the
      # pub.dev trusted-publishing step, for reasons that look unrelated.
      - name: Verify release token is configured
        # This step runs before checkout, so the job's `packages/flutter`
        # working directory does not exist yet and bash would fail to start.
        # Pin this step to the repo root.
        working-directory: .
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "ERROR: the RELEASE_GITHUB_TOKEN repository secret is not set."
            echo "ERROR: this run must check out the tag with the release PAT; GITHUB_TOKEN"
            echo "ERROR: is not a substitute for the identity pub.dev's trusted publishing expects."
            echo "ERROR: create the secret (classic PAT with 'repo' + 'workflow' scopes) and re-run."
            exit 1
          fi

          # /user is the cheapest endpoint that actually authenticates the token:
          # an invalid, expired or empty one comes back 401. (Auth-free endpoints
          # answer 200 to anything, so they cannot tell a working secret from a
          # missing one.) Only the status code is read, never the response body,
          # and the token itself stays out of the log either way.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "authorization: Bearer $RELEASE_TOKEN" \
            https://api.github.com/user)
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: RELEASE_GITHUB_TOKEN was not accepted by GitHub (HTTP $STATUS) — it is invalid or expired."
            exit 1
          fi
          echo "Release token is present and accepted by GitHub."

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Validate ref is a flutter/v* tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/flutter/v*) ;;
            *)
              echo "ERROR: This workflow must run against a flutter/v* tag ref (got: $GITHUB_REF)"
              echo "Dispatch via release-mobile.yml, or select a flutter/v* tag from the 'Use workflow from' dropdown."
              exit 1
              ;;
          esac

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/flutter/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing Flutter SDK v$VERSION"

      - uses: ./.github/actions/setup-flutter

      # A custom publish workflow must perform the OIDC exchange itself; this is
      # the action documented for exactly that. It requests a JWT with audience
      # https://pub.dev, exports it as PUB_TOKEN, and registers it as a pub
      # credential. Without it `dart pub publish` finds no credential and falls
      # back to interactive OAuth, which waits forever for a browser click that
      # never comes in CI.
      - uses: flutter-actions/setup-pubdev-credentials@v1

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Validate package
        run: dart pub publish --dry-run

      - name: Check if version already published
        id: check_published
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pub.dev/packages/quiltt_connector/versions/${{ steps.version.outputs.version }}.json")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version ${{ steps.version.outputs.version }} already published to pub.dev, skipping"
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      # Never reach the publish step without a credential. Publishing with none
      # does not fail — it opens an interactive OAuth prompt and blocks until the
      # job times out, which is how the 6.1.6 attempt sat silent for 20 minutes.
      - name: Verify OIDC credential is available
        if: steps.check_published.outputs.already_published != 'true'
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ERROR: no OIDC token endpoint — the job needs 'id-token: write'."
            exit 1
          fi
          if [ -z "${PUB_TOKEN:-}" ]; then
            echo "ERROR: PUB_TOKEN is not set, so no pub.dev credential was registered."
            echo "ERROR: 'dart pub publish' would block on an interactive OAuth prompt."
            echo "ERROR: check the setup-pubdev-credentials step and that pub.dev trusted"
            echo "ERROR: publishing is enabled for this repository and tag pattern."
            exit 1
          fi
          echo "OIDC credential is present for pub.dev."

      - name: Publish to pub.dev
        if: steps.check_published.outputs.already_published != 'true'
        run: dart pub publish --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "flutter/v${{ steps.version.outputs.version }}"
          name: "Flutter SDK v${{ steps.version.outputs.version }}"
          body: |
            ## Flutter SDK v${{ steps.version.outputs.version }}

            ### Installation

            ```yaml
            dependencies:
              quiltt_connector: ^${{ steps.version.outputs.version }}
            ```

            Published to [pub.dev](https://pub.dev/packages/quiltt_connector).
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
