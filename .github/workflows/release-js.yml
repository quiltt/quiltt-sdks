name: Release JS SDKs

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    # prevent this action from running on forks
    if: github.repository == 'quiltt/quiltt-sdks'

    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: read
      statuses: write
      checks: write

    steps:
      # Checked before checkout: an unset secret is indistinguishable from a
      # working one, and actions/checkout silently falls back to GITHUB_TOKEN
      # when `token:` is empty. The tags changesets then pushes would trigger no
      # workflows at all — the mobile and Flutter releases would never start,
      # while every job still reported success.
      - name: Verify release token is configured
        env:
          RELEASE_TOKEN: ${{ secrets.QUILTTY_RELEASE_GITHUB_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "ERROR: the QUILTTY_RELEASE_GITHUB_TOKEN repository secret is not set."
            echo "ERROR: the release tags would be pushed with GITHUB_TOKEN, which cannot"
            echo "ERROR: trigger release-mobile.yml or release-flutter.yml."
            echo "ERROR: create the secret (classic PAT with 'repo' + 'workflow' scopes) and re-run."
            exit 1
          fi

          # /user is the cheapest endpoint that actually authenticates the token:
          # an invalid, expired or empty one comes back 401. (Auth-free endpoints
          # answer 200 to anything, so they cannot tell a working secret from a
          # missing one.) Only the status code is read, never the response body,
          # and the token itself stays out of the log either way.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "authorization: Bearer $RELEASE_TOKEN" \
            https://api.github.com/user)
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: QUILTTY_RELEASE_GITHUB_TOKEN was not accepted by GitHub (HTTP $STATUS) — it is invalid or expired."
            exit 1
          fi
          echo "Release token is present and accepted by GitHub."

      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.QUILTTY_RELEASE_GITHUB_TOKEN }}

      - name: Setup environment
        uses: ./.github/actions/setup-js
        with:
          build-packages: "false"

      - name: Authenticate with npm registry
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm authentication
        run: npm whoami --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release pull request or release to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run publish
          title: Version and Release Packages
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.QUILTTY_RELEASE_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
