name: Release Mobile SDKs

# Triggered when the JS packages are published by Changesets.
# All mobile SDKs are released at the same version for a unified release.
on:
  push:
    tags:
      - "@quiltt/core@*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  # ── 1. Extract the version from the Changesets tag ───────────────────────────
  prepare:
    name: Extract version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/@quiltt/core@}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing mobile SDKs v$VERSION"

  # ── 2. Update all platform version files in a single commit ──────────────────
  update-versions:
    name: Update version files
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # No `token:` on purpose — the explicit PAT below is the single
          # credential for every write in this job. See "Create platform tags".
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Update Android version files
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed -i 's/version = ".*"/version = "'"$VERSION"'"/' \
            packages/android/connector/build.gradle.kts
          printf 'package app.quiltt.connector\nval quilttSdkVersion = "%s"\n' "$VERSION" \
            > packages/android/connector/src/main/java/app/quiltt/connector/QuilttSdkVersion.kt

      - name: Update Flutter version files
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: $VERSION/" packages/flutter/pubspec.yaml
          echo "const quilttSdkVersion = \"$VERSION\";" > packages/flutter/lib/quiltt_sdk_version.dart

      - name: Update iOS version file
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          printf 'import Foundation\n\npublic let quilttSdkVersion = "%s"\n' "$VERSION" \
            > packages/ios/Sources/QuilttConnector/QuilttSdkVersion.swift

      # Authenticate every write in this job with the release PAT. A push made
      # with the default GITHUB_TOKEN can never trigger another workflow, which
      # is subtly fatal here: release-flutter.yml is triggered by the
      # `flutter/v*` tag push below, and pub.dev's trusted publishing refuses
      # any run that was not triggered by an actual tag push.
      - name: Authenticate Git with the release token
        env:
          GH_PAT: ${{ secrets.QUILTTY_RELEASE_GITHUB_TOKEN }}
        run: |
          # Clear any inherited helper so this is the only credential.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local credential.helper ""
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w 0)"

      - name: Commit and push version updates
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git add \
            packages/android/connector/build.gradle.kts \
            packages/android/connector/src/main/java/app/quiltt/connector/QuilttSdkVersion.kt \
            packages/flutter/pubspec.yaml \
            packages/flutter/lib/quiltt_sdk_version.dart \
            packages/ios/Sources/QuilttConnector/QuilttSdkVersion.swift
          git diff --cached --quiet || git commit -m "chore: release v$VERSION"
          git pull --rebase origin main
          git push origin main

      - name: Create platform tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.QUILTTY_RELEASE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          tags_to_push=()
          flutter_tag_pushed=false

          for tag in "v$VERSION" "android/v$VERSION" "flutter/v$VERSION" "ios/v$VERSION"; do
            remote_ref=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
            # Prefer the peeled commit SHA (^{}) for annotated tags; fall back to the
            # direct SHA for lightweight tags.
            REMOTE_SHA=$(echo "$remote_ref" | awk '$2 ~ /\^\{\}$/ {print $1; exit}')
            if [ -z "$REMOTE_SHA" ]; then
              REMOTE_SHA=$(echo "$remote_ref" | awk 'NR==1 {print $1}')
            fi

            if [ -n "$REMOTE_SHA" ]; then
              if [ "$REMOTE_SHA" != "$HEAD_SHA" ]; then
                echo "ERROR: Tag $tag exists on origin at $REMOTE_SHA but HEAD is $HEAD_SHA — aborting"
                exit 1
              fi
              echo "Tag $tag already exists on origin at correct commit, skipping"
              continue
            fi

            # Tag missing on origin — force-create local tag at HEAD (overwrites any stale local tag)
            git tag -f "$tag" HEAD
            tags_to_push+=("refs/tags/$tag:refs/tags/$tag")
            if [ "$tag" = "flutter/v$VERSION" ]; then
              flutter_tag_pushed=true
            fi
          done

          if [ ${#tags_to_push[@]} -gt 0 ]; then
            # Pushing flutter/v$VERSION triggers release-flutter.yml
            # (on: push: tags: flutter/v*) — required for pub.dev's OIDC
            # trusted-publishing check, which rejects workflow_dispatch runs.
            #
            # This push MUST be authenticated by the release PAT (set up by
            # "Authenticate Git with the release token"). A tag push made with
            # the default GITHUB_TOKEN triggers no workflows at all, which
            # silently skips the Flutter publish.
            git push --atomic origin "${tags_to_push[@]}"
          fi

          # Fail loudly if the Flutter publish was not scheduled. Without this a
          # non-triggering push looks identical to a healthy release: every job
          # succeeds while pub.dev silently stays a version behind.
          if [ "$flutter_tag_pushed" = true ]; then
            echo "Verifying that release-flutter.yml started for flutter/v$VERSION..."
            for _ in $(seq 1 20); do
              RUNS=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/release-flutter.yml/runs?per_page=20" \
                --jq '[.workflow_runs[] | select(.head_branch == "flutter/v'"$VERSION"'" and .event == "push")] | length' \
                2>/dev/null || echo 0)
              if [ "${RUNS:-0}" -gt 0 ]; then
                echo "release-flutter.yml is running for flutter/v$VERSION"
                exit 0
              fi
              sleep 10
            done
            echo "ERROR: flutter/v$VERSION was pushed but release-flutter.yml did not start."
            echo "ERROR: the Flutter SDK will NOT be published to pub.dev."
            echo "ERROR: verify the tag push is authenticated with the release PAT."
            exit 1
          fi

  # ── 3a. Build, test, and publish Android to Maven Central ────────────────────
  publish-android:
    name: Publish Android
    needs: [prepare, update-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/android

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # No Gemfile.lock is committed: `bundler-cache` runs `bundle lock` when one
      # is missing, so it installs and caches the newest compatible gems.
      # The Ruby version is read from .ruby-version.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build and test
        run: |
          ./gradlew clean build
          ./gradlew connector:assembleRelease
          ./gradlew connector:test
          ./gradlew connector:lint

      - name: Build example app
        run: bundle exec fastlane android build_example_app

      - name: Publish to Maven Central (Portal API)
        env:
          ANDROID_SIGNING_KEY_ID: ${{ secrets.ANDROID_SIGNING_KEY_ID }}
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://repo1.maven.org/maven2/io/quiltt/connector/$VERSION/connector-$VERSION.pom")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version $VERSION already published to Maven Central, skipping"
            exit 0
          fi

          ./gradlew publishConnectorPublicationToLocalStagingRepository
          cd build/local-staging
          zip -r ../../connector-bundle.zip .
          cd ../..
          MAVEN_CENTRAL_TOKEN=$(printf "%s:%s" "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w 0)
          curl --fail --request POST \
            --header "Authorization: Bearer $MAVEN_CENTRAL_TOKEN" \
            --form "bundle=@connector-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=io.quiltt%3Aconnector%3A${{ needs.prepare.outputs.version }}&publishingType=AUTOMATIC"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android/v${{ needs.prepare.outputs.version }}"
          name: "Android SDK v${{ needs.prepare.outputs.version }}"
          body: |
            ## Android SDK v${{ needs.prepare.outputs.version }}

            ### Installation

            **Gradle (Kotlin DSL):**
            ```kotlin
            dependencies {
                implementation("io.quiltt:connector:${{ needs.prepare.outputs.version }}")
            }
            ```

            **Maven:**
            ```xml
            <dependency>
                <groupId>io.quiltt</groupId>
                <artifactId>connector</artifactId>
                <version>${{ needs.prepare.outputs.version }}</version>
            </dependency>
            ```

            Requires Android API Level 26+.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3b. Flutter is published by release-flutter.yml (triggered by flutter/v* tag) ──

  # ── 3c. Build, test, and release iOS ─────────────────────────────────────────
  release-ios:
    name: Release iOS
    needs: [prepare, update-versions]
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/ios

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      # No Gemfile.lock is committed: `bundler-cache` runs `bundle lock` when one
      # is missing, so it installs and caches the newest compatible gems.
      # The Ruby version is read from .ruby-version.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build Swift package
        working-directory: .
        run: swift build -c release

      - name: Run tests
        working-directory: .
        run: swift test

      - name: Build example app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec fastlane ios build_example_app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ios/v${{ needs.prepare.outputs.version }}"
          name: "iOS SDK v${{ needs.prepare.outputs.version }}"
          body: |
            ## iOS SDK v${{ needs.prepare.outputs.version }}

            ### Swift Package Manager

            In Xcode: **File → Add Package Dependencies**, enter the repository URL and select version `${{ needs.prepare.outputs.version }}`.

            Or in `Package.swift`:
            ```swift
            .package(url: "https://github.com/quiltt/quiltt-sdks", from: "${{ needs.prepare.outputs.version }}")
            ```
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
