  # yargs 18 is ESM-only and dropped the v17 chained API that React Native's
  # codegen scripts and metro's CLI still call, so every pre-18 consumer stays on
  # 17.7.3 — with the 18.1.0 `__proto__` merge guard backported via
  # `patchedDependencies` (AIKIDO-2026-922647) — until those packages migrate.
  'yargs@<18.0.0': 17.7.3
  'yargs@>18.0.0 <=18.1.0': ^18.1.0
  'zod@3': 4.6.6
